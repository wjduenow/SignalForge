name: ci

on:
  pull_request:
    branches: [main, dev, "release/*"]
  push:
    branches: [main, dev, "release/*"]
  # Manual trigger for the gated `airflow` job (heavy, constraints-pinned — not run
  # on every push). See docs/research/airflow-test-environment.md.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        # Python 3.13 changed `Path.resolve()` to raise
        # `OSError(errno.ELOOP)` instead of `RuntimeError` on cyclic
        # symlinks (gh-108958). The path-safety catch sites in
        # `signalforge/_common/path_safety.py`,
        # `signalforge/manifest/loader.py`, and `signalforge/demo/__init__.py`
        # handle both signals as of issue #96, so 3.13 is back in the matrix.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          # CI is read-only; never pushes. Don't persist the GITHUB_TOKEN
          # in .git/config — least-privilege per actions/checkout security
          # guidance (https://github.com/actions/checkout#:~:text=persist-credentials).
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          # Disable the GitHub Actions cache for the uv download. On a
          # public repo, PR-triggered runs share a cache scope with the
          # base branch; an explicit `false` removes the cache-poisoning
          # vector across that trust boundary. Runs are fast enough that
          # the lost cache is negligible.
          enable-cache: false
      - name: Sync dev dependencies
        run: uv sync --dev
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Pyright
        # Pyright pins to the matrix FLOOR (`pyright.pythonVersion = "3.11"`
        # in pyproject.toml). Running it 3x adds no signal — gate to once.
        if: matrix.python-version == '3.11'
        run: uv run pyright
      - name: Pytest
        run: uv run pytest
      - name: Upload coverage to Codecov
        # Upload from one matrix iteration (3.13, the current ceiling)
        # to avoid duplicate uploads. Coverage is interpreter-invariant
        # for this codebase; the choice is conventional, not load-bearing.
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe  # v5.5.4
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  airflow:
    # Gated Apache Airflow integration tests. Opt-in — NOT part of the default
    # 3.11/3.12/3.13 lint-test matrix: Airflow's tree is heavy and version-pinned
    # via a per-(airflow, python) constraints file, too costly to carry on every
    # job. Runs only on PRs labelled `airflow` or via manual workflow_dispatch.
    # Full contract: docs/research/airflow-test-environment.md.
    if: contains(github.event.pull_request.labels.*.name, 'airflow') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        # Certified floor (issue #229). Add "3.0.x" when the Airflow 3.x story
        # is decided — one-line change, no other edits needed.
        airflow-version: ["2.10.4"]
        python-version: ["3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false  # read-only; never pushes
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false  # no shared cache across PR trust boundary
      - name: Install Airflow + SignalForge under constraints
        run: |
          CONSTRAINTS="https://raw.githubusercontent.com/apache/airflow/constraints-${{ matrix.airflow-version }}/constraints-${{ matrix.python-version }}.txt"
          uv venv
          uv pip install "apache-airflow==${{ matrix.airflow-version }}" --constraint "$CONSTRAINTS"
          # `-e .` until the skeleton child (epic #228) ships the `[airflow]` extra,
          # then `-e ".[airflow]"`. The --constraint is load-bearing: without it uv
          # upgrades protobuf 4->5 (+ pydantic) over Airflow 2.10.4's pins and risks
          # breaking it; with it, signalforge resolves cleanly inside those pins.
          uv pip install -e . --constraint "$CONSTRAINTS"
          # Test tooling under the same constraints — the `[airflow]` extra carries no
          # test deps, so without pytest-cov the `--no-cov` flag is unrecognised.
          uv pip install pytest pytest-cov pytest-asyncio --constraint "$CONSTRAINTS"
      - name: Airflow operator + DAG-parse tests (gated marker)
        # Run in the env we just populated (NOT `uv run`, which targets a fresh sync).
        # `--no-cov` because `--cov-fail-under` in addopts fails marker-only runs.
        run: .venv/bin/python -m pytest -m airflow --no-cov

  docs-build:
    # Read-only "does the site still build?" gate. Runs on every PR and
    # push (same triggers as lint-test) so a broken mkdocs.yml / plugin
    # config / include-markdown syntax error fails the PR instead of
    # silently merging and only breaking the post-merge deploy. No write
    # permissions — this never touches gh-pages.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          # Read-only build; never pushes. Least-privilege.
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: false  # no shared cache across PR trust boundary
      - name: Build the docs site
        # `--only-group docs` installs JUST MkDocs + plugins, not the
        # heavy dev set. Non-strict build: it returns non-zero on real
        # config/syntax/plugin errors (the cases this gate exists to
        # catch) but tolerates the expected warnings on repo-internal
        # links to plans/super/ and .claude/rules/ that aren't published.
        run: uv run --only-group docs mkdocs build

  docs:
    # Publish the MkDocs site to GitHub Pages. Triggers only on push to
    # main — `main` is the released line; the published site reflects
    # the last release, not every dev iteration. See
    # `.claude/rules/docs-publishing.md` for the full deploy contract.
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Only the docs deploy job needs write access (to push the built site
    # to the `gh-pages` branch). The workflow default `contents: read`
    # covers every other job.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        # `mkdocs gh-deploy` issues a real `git push` to the `gh-pages`
        # branch — it relies on the persisted GITHUB_TOKEN in the
        # runner's git config. Do NOT set `persist-credentials: false`
        # here; doing so breaks the deploy. The token is post-job-cleaned
        # by the runner; the scope is bounded by `permissions.contents:
        # write` above.
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          # Same floor as publish.yml — keeps the doc-build interpreter
          # deterministic across runs.
          python-version: "3.11"
          enable-cache: false  # no shared cache across PR trust boundary
      - name: Deploy to GitHub Pages
        # `--only-group docs` keeps the deploy env minimal (no dbt-core /
        # pyright). `--force` overwrites the prior gh-pages commit (the
        # site is generated, not authored). `--no-history` keeps the
        # gh-pages branch shallow so the repo stays small.
        run: uv run --only-group docs mkdocs gh-deploy --force --no-history
