# Committed alongside the fixture project so contributors don't need a real
# warehouse to regenerate the compiled manifest. Set DBT_PROFILES_DIR to this
# directory before invoking `dbt deps && dbt compile` (see ../regenerate.sh).
signalforge_test_expectations:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: 'dev.duckdb'
      threads: 1
