# Hand-crafted fixture project for the Databricks live e2e (issue #226).
# Targets dbt-databricks 1.8.x over the Unity Catalog samples.nyctaxi dataset.
# Profile `nyctaxi` is defined in the sibling profiles.yml; the maintainer regen
# note (README.md) sets DBT_PROFILES_DIR to this directory before invoking
# `dbt parse`. The committed manifest.json under target/ is hand-crafted, NOT
# generated, because Ralph workers / CI cannot reach live Databricks.
name: signalforge_test_nyctaxi
version: 1.0.0
config-version: 2

profile: nyctaxi

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: target
clean-targets:
  - target
  - dbt_packages

models:
  signalforge_test_nyctaxi:
    staging:
      +materialized: view
